name: CI

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace @asdmr/api

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  api-tests:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: asdmr_voting_test
          POSTGRES_USER: asdmr_voting
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asdmr_voting -d asdmr_voting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://asdmr_voting:ci_test_only@localhost:5432/asdmr_voting_test?schema=public
      TEST_DATABASE_URL: postgresql://asdmr_voting:ci_test_only@localhost:5432/asdmr_voting_test?schema=public
      MODERATOR_ACCESS_TOKEN: ci_test_moderator_token_at_least_32_chars
      WEB_ORIGIN: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace @asdmr/api

      - name: Apply database migrations
        run: npm run db:deploy --workspace @asdmr/api

      - name: Run API unit tests
        run: npm test --workspace @asdmr/api

      - name: Run API integration tests
        run: npm run test:integration --workspace @asdmr/api

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-real:
    name: Playwright E2E (real stack)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run real-stack Playwright tests
        run: npm run test:e2e:real-stack

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
