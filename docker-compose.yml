services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asdmr_voting}
      POSTGRES_USER: ${POSTGRES_USER:-asdmr_voting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asdmr_voting} -d ${POSTGRES_DB:-asdmr_voting}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: asdmr_voting_test
      POSTGRES_USER: asdmr_voting
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asdmr_voting -d asdmr_voting_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
